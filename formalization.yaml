jsp_id: JSP-000090
catalog_url: https://github.com/TheJustinSunPrize/awards
status: wip
prize_ready: false
last_round: 172
last_round_summary: |
  Round 172 -- THE EIGHT-VERTEX SEVEN-CYCLE CASE OF Erdos #73, CLOSED WITH THE OPTIMAL CONSTANT 1,
  BY REMOVING THE FIVE-POSITION HYPOTHESIS FROM THE WITNESS LEMMA.  Attack family 93.  One new file
  lean/JSPProblem/CycWitness.lean (23 declarations, 0 sorry/admit), lake build OK with 1331 jobs,
  axiom report clean (propext, Classical.choice, Quot.sound), imported from the root module
  JSPProblem.lean.  score.py --strict-prize: build_ok=true, sorry=0, admit=0, partial_ok=true,
  missing_theorems = ['jsp_000090_main'].

  (i)  ROUNDS 152-162 WERE STATED ON Fin 5, AND ONLY TWO THINGS IN THAT CHAIN ARE REALLY ABOUT FIVE:
       five_flip_false / five_pair_inj' (pure modular arithmetic on Fin 5) and
       card_neighIn_five_eq_two (which used TRIANGLE-FREENESS to make (C \ {c}) u {x} chordless).
       Both are replaced here by order-free statements:
         JSP90.hshort_of_card_eq                     -- an odd cycle of the same cardinality as a
                                                        shortest one is shortest (so |D| = |C| makes D
                                                        induced, with NO triangle-freeness needed);
         JSP90.filter_adj_C_eq_ringPair_of_five_le   -- the neighbours of o.f j inside a shortest odd
                                                        cycle of ANY length >= 5 are exactly its two
                                                        ring-neighbours (built from the already
                                                        order-free JSP90.card_neighIn_C_eq_two and
                                                        JSP90.neigh_eq_of_adj_of_adj of Seven.lean);
         JSP90.filter_adj_eq_of_cycle_singleton      -- (C \ {c}) u {x} an odd cycle of cardinality
                                                        |C| means x sees C exactly as c does
                                                        (round 152's filter_adj_eq_of_fiveCycle_
                                                        singleton, with the triangle step replaced by
                                                        "a triangle is an odd cycle shorter than C");
         JSP90.x_ne_y_of_two_sevenCycles_singleton -- THE WITNESS IS INJECTIVE, FOR ANY CYCLE LENGTH
                                                        >= 5: two distinct missed points of C have
                                                        distinct outside vertices;
         JSP90.card_missedSeven_le_card_univ_sdiff  -- the missed points inject into V \ C, so
                                                        |Missed| <= |V \ C| order-free.

  (ii) THE INSTANCE.  At LocIndep 1 and |V| <= 8 with a shortest odd cycle C of SEVEN vertices,
       every odd cycle D has 7 <= |D| odd and |D| <= 8, hence |D| = 7, and D != C forces
       |D \ C| = |C \ D| = 1.  So EVERY missed point of C is missed by a cycle of the form
       (C \ {c}) u {x} (JSP90.subset_missed_of_card_V_le_card_C_add_one, order-free), and the
       pigeonhole gives |AllMissed| <= |V \ C| <= 1 < 7 = |C|:
         JSP90.hitsOddCycles_mem_C_of_shortest_seven_of_card_le_add_one  (certificate ON C),
         JSP90.closeToBipartite_one_of_shortest_seven_of_card_le_add_one  -- A NEW INSTANCE OF THE
           HEADLINE THEOREM WITH THE OPTIMAL CONSTANT 1, stated as |V| <= |C| + 1 and with NO LocIndep
           hypothesis at all,
         JSP90.closeToBipartite_one_of_shortest_seven_of_card_le_eight,
         JSP90.closeToBipartite_one_of_locIndep_one_card_le_eight_of_oddGirth_ge_seven  -- the
           eight-vertex odd-girth-at-least-seven class instance,
         JSP90.erdos73On_one_oddGirth_ge_seven_eight  -- the same in the Erdős73On shape,
         JSP90.tauOdd_le_one_of_shortest_seven_of_card_le_eight,
         JSP90.not_closeToBipartite_zero_of_oddGirth_ge_seven_eight_of_not_isBipartite  -- the
           constant 1 is optimal inside the class.
       Together with round 171's JSP90.triCaseEight this leaves ONE case of
       JSP90.closeToBipartite_two_of_locIndep_one_card_le_eight: the five-cycle case.

  (iii) MEASUREMENT (discovery/JSP-000090/r172b.c, all 2^21 graphs on Fin 8 containing the 7-cycle):
       160 LocIndep-1 graphs have odd girth 7; |{c in C : some odd cycle misses c}| is 0 in 128 of
       them and 1 in 32 (the bound |AllMissed| <= |V \ C| <= 1 is attained 32 times, so the theorem
       is not vacuous and the pigeonhole is tight); tau_odd = 1 in all 160.

  (iv) MEASUREMENT OF THE REMAINING FIVE-CYCLE CASE (discovery/JSP-000090/r172.c, all 2^23 graphs on
       Fin 8 containing the five-cycle): of 3 051 680 LocIndep-1 graphs in which that five-cycle is
       shortest, max |AllMissed| = 5 (attained 110 times), so CloseToBipartite 1 with the certificate
       on C is FALSE at order eight; the number of three-intersection five-cycles reaches 6 (so round
       162's uniqueness fails), and points missed by four-intersection five-cycles reach 4.  But a PAIR
       of points of C meets every odd cycle in every one of the 3 051 680 cases (0 failures) and
       tau_odd = 1 throughout, so the eight-vertex five-cycle case is TRUE with the certificate a pair
       of points of the shortest odd cycle -- the next concrete target.

