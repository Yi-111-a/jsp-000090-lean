last_round_summary: |
  Round 119 -- THE PETAL SET: THE ONE-ATTACHMENT ODD CYCLES AND A QUANTITATIVE ABSORPTION STEP
  (attack family 57).  New module lean/JSPProblem/Petal.lean (21 declarations, 0 sorry/admit, lake
  build OK with 1268 jobs), imported from the root module JSPProblem.lean.  Round 118's next_bet asked
  for the counting half of the Mader step (how many one-attachment odd cycles hang off a shortest odd
  cycle); this round does not count them but introduces the finite quantity that controls them --
  JSP90.PetalSet G C, the set of vertices of C lying ALONE on some odd cycle of G (the attachment
  points of the petals) -- and proves the transversal certificate and the absorption step built on it.
  New objects: JSP90.OneAttach G C D (a petal: an odd cycle meeting C in exactly one vertex) and
  JSP90.PetalSet G C, with petalSet_subset, card_petalSet_le_card, petalSet_empty_of_isBipartite and
  oneAttach_mem_petalSet.  HEADLINE 1: JSP90.petalSet_transversal -- if every odd cycle of G meets the
  odd cycle C, then a SUBSET of C with at most |C| - 1 + |PetalSet G C| vertices meets every odd cycle
  of G (certificate C.erase c u PetalSet G C, for any c in C).  HEADLINE 2:
  JSP90.closeToBipartite_of_residue_petalSet -- the residue absorption step of round 40
  (CloseToBipartite q (G - C) => CloseToBipartite (q + |C|) G) becomes
  CloseToBipartite (q + |PetalSet G C| + (|C| - 1)) G, and closeToBipartite_of_residue_petalSet_zero
  gives q + |C| - 1, ONE VERTEX BETTER THAN ROUND 40, in the case of an empty petal set; so the |C|
  term is only ever needed to pay for the attachment points.  ALSO: erdos73On_of_petalSet, a NEW INSTANCE
  OF THE HEADLINE THEOREM with the growing parameter a (CloseToBipartite (a + |C| - 1) G, constant
  independent of k, and LocIndep not even needed for that step); erdos73On_of_petalSet_of_residue, the
  two-parameter instance; closeToBipartite_of_petalSet_empty and closeToBipartite_of_twoAttach', which
  RE-DERIVE round 111's two-attachment transversal (bound |C| - 1) because the two-attachment
  hypothesis is exactly "PetalSet G C is empty"; and JSP90.IsOddCycle.of_finset_ext /
  of_finset_eq, transport lemmas that remove the round-53 DecidableEq-instance pitfall for any later
  concrete witness.  NOT proved: the bound |PetalSet G C| <= phi(k) -- with the absorption step now
  quantified, this is the single missing lemma and it is PURELY NUMERICAL; the nine-vertex witness
  that the petal term cannot be dropped (triangle with a pendant triangle at each vertex) was
  elaborated this round but dropped from the build, its construction and the four elaboration pitfalls
  being recorded in discovery/JSP-000090/policy.json.  NOT proved: jsp_000090_main (still not
  declared) and JSP90.OddCycleErdosPosa r, which is unchanged; round 119 improves the absorption step,
  not the theorem.
