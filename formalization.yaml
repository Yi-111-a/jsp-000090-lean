last_round_summary: |
  Round 134 -- REFUTATION OF THE TOP TARGET OF ROUNDS 119-133.  Attack family 63.  Two new files,
  0 sorry/admit, lake build OK with 1284 jobs, axiom report clean (propext, Classical.choice,
  Quot.sound), imported from the root module JSPProblem.lean.

  (i)  THE RESIDUAL JSP90.PetalSetLeTwoOfOne IS FALSE.  The exhaustive search of this round
       (discovery/JSP-000090/r134.c) over all graphs with MaxDef <= 1 on n <= 8 (55 179 262 of them,
       140 216 552 triangles) found no failure, and at n = 9 found the first counterexample: the
       graph g9 with edges 0-5 0-6 0-7 0-8 1-5 1-6 2-5 2-8 3-6 3-7 4-7 4-8 5-7 6-8 satisfies
       LocIndep 1 and BOTH of its triangles, T1 = {0,5,7} and T2 = {0,6,8}, have three attachment
       points.  lean/JSPProblem/Nonagon.lean formalises the witness (JSP90.locIndep_one_g9 is an
       exhaustive kernel decision over the 2^9 vertex sets; the two triangles and the six petals are
       explicit cyclic orderings) and lean/JSPProblem/AttachErase.lean draws the consequences:
       JSP90.not_forall_oddCycle_exists_erase_g9 (no triangle of g9 has a 2-subset meeting every odd
       cycle), JSP90.not_exists_twoTransversal_sub_g9_T1 / _T2 (no two vertices of a shortest odd
       cycle suffice either), JSP90.triangleCertificates_are_impossible.  The measured certificate of
       CloseToBipartite 2 g9 is {5,6}, which lies in NEITHER triangle, so f(1) = 2 survives while every
       triangle-based certificate shape is dead.

  (ii) THE ERASABLE VERTICES OF AN ODD CYCLE, EXACTLY.  JSP90.hitsOddCycles_erase_iff_notMem_petalSet
       proves, for every odd cycle C meeting every odd cycle and every p in C,
       HitsOddCycles G (C.erase p) <-> p not in PetalSet G C: the vertices that cannot be erased are
       exactly the attachment points.  Hence JSP90.erdos73On_of_isOddCycle_of_petalSet_lt_card, a new
       instance of the headline theorem with the constant |C| - 1 for an ARBITRARY odd cycle (Two.lean
       had it only for triangles), and an odd-girth bound of l - 1 at k = 1.

  (iii) THE HONEST RESIDUAL OF THE SHARP CASE k = 1 IS A SINGLE STATEMENT:
       JSP90.erdos73On_one_iff_twoTransversal : Erdős73On 1 m <-> TwoTransversal m, i.e. "some m
       vertices meet every odd cycle".  The two conjectures drafted in this round from measurements
       (PetalSetLeTwoOfOneAny and ShortestOddCycleTransversal m) were REFUTED by the same witness and
       are now marked as defs that must not be assumed in the source.  The triangle-free half is
       JSP90.TriangleFreeTwoTransversal 2, proved equivalent to the triangle-free case of the sharp
       conclusion by JSP90.triangleFree_iff_triangleFreeTwoTransversal.

  (iv) The "high intersection" hypothesis of Two.lean item 5 is not automatic at LocIndep 1, even at a
       shortest odd cycle: JSP90.not_forall_card_sdiff_le_one_wf (the windmill wf of
       JSPProblem/Windmill.lean).

  NOT proved: jsp_000090_main.  JSP90.OddCycleErdosPosa r (Reed-Robertson-Seymour-Thomas) is untouched.
  score.py --strict-prize reports build_ok = true, sorry = 0, admit = 0, partial_ok = true,
  missing_theorems = ["jsp_000090_main"].  No award claim is made.
