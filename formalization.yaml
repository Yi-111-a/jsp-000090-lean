last_round_summary: |
  Round 110 -- THE CUT-VERTEX PIECE AXIS: THE ONE-SIDED 1-CUT IS FREE (attack family 51).  New module
  lean/JSPProblem/Piece.lean (34 declarations, 802 lines, 0 sorry/admit, lake build OK with 1261
  jobs), imported from the root module JSPProblem.lean.  Round 109 localised the remaining gap of the
  1-cut axis to the ONE-SIDED CHAINS and asked for the block-cut tree or the classical short-C-path
  lemma, neither of which exists in the pinned Mathlib.  This round shows NEITHER IS NEEDED: the
  object to control is not the part T_i but the PIECE T_i u {v}, and the two differ exactly in the
  right direction.  Proved: OneSplit.cycle_subset_piece -- THE MISSING STRUCTURAL LEMMA, an odd cycle
  CONTAINING the cut vertex lies in a single piece (the companion of round 48's cycle_subset_part,
  which says a cycle AVOIDING it lies in a single part) -- so the odd cycles of G are exactly the odd
  cycles of its pieces (OneSplit.oddCycle_piece, OneSplit.isOddCycle_iff_pieces); monotonicity at a
  cut vertex AT THE SAME CONSTANT (closeToBipartite_piece_of_closeToBipartite,
  closeToBipartite_pieces_of_closeToBipartite); THE COMPOSITION RULE WITHOUT THE +1
  (closeToBipartite_of_1split_bounded_pieces, m*t against 1 + m*k in Connect.lean, because the cut
  vertex lies in every piece); THE SHARP TWO-PIECE COMPOSITION
  closeToBipartite_of_1split_twoPieces (2*m, independently of t, the first constant on this axis that
  does not grow with the number of parts); closeToBipartite_of_1split_nonBipartitePieces (only the
  non-bipartite pieces are charged, still no +1).  THE HEADLINE OF THE ROUND:
  JSP90.closeToBipartite_iff_of_oneNonBipartitePiece -- CloseToBipartite m G <-> CloseToBipartite m
  (T_i0 u {v}) when that piece is the only non-bipartite one, i.e. THE ONE-SIDED 1-CUT IS FREE -- the
  one-sided chains are deleted at ZERO COST and no tree and no path is needed; with
  isOddCycle_iff_of_oneNonBipartitePiece and hitsOddCycles_iff_of_oneNonBipartitePiece the reduction
  loses NOTHING (the whole odd-cycle structure of G is that of the single piece, as the same
  finsets); and closeToBipartite_iff_of_twoSideCuts, where the reduction ITERATES, i.e. the
  classical block-cut reduction in two steps.  New instances of the headline theorem along the piece
  axis: erdos73On_of_1split_of_bounded_PIECES, oddCycleErdosPosa_of_1split_of_bounded_PIECES,
  erdos73On_of_1split_pieces_of_locIndep_sub -- hypothesis on the PIECES, constant m*t, no +1 and NO
  counting step (round 48's OneSplit.card_nonBipartiteParts_le is not used).  A MACHINE-CHECKED
  OBSTRUCTION closes the axis: wf_oneSplit is a 1-CUT of the windmill wf at 0 (Windmill.lean had only
  the 2-cut {0,5}), not_isBipartite_wf_piece_0/1 show TWO of its three pieces are non-bipartite, and
  wf_locIndep_one_two_nonBipartitePieces records LocIndep 1 wf together with 2 > k = 1 non-bipartite
  pieces -- so |nonBipartitePieces| <= k is FALSE and no f(k) comes from the piece count.  A tempting
  statement recorded as false: CloseToBipartite m G <-> every piece is m-close (two disjoint triangles
  with pendants at the cut vertex), so the m*t factor of the composition is real.  NOT proved:
  jsp_000090_main; the blocker JSP90.OddCycleErdosPosa r is unchanged, and it is now localised to the
  graphs with NO CUT VERTEX, i.e. the 2-connected case, where Mader's structure theorem and a
  Menger-type fan lemma are needed.


