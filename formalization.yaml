last_round_summary: |
  Round 109 -- THE DECREASE AT A HARD 1-CUT, AND THE BLOCK-CUT BOUND (attack family 50).  New
  module lean/JSPProblem/Chain.lean (18 declarations, 0 sorry/admit, lake build OK with 1260 jobs),
  imported from the root module JSPProblem.lean.  Round 108 closed the class axis and named the
  packing-number axis; this round works on its quantitative content.  What JSPProblem/Connect.lean
  (round 48) had along the 1-cut axis was a COUNT of the charged parts
  (OneSplit.card_nonBipartiteParts_le) and an instance with the constant 1 + m*r; what it lacked is
  how much the packing bound DROPS at a 1-cut.  Proved: OneSplit.oddCycle_family_erase (one odd
  cycle in each of the other non-bipartite parts, pairwise disjoint, as many as there are parts),
  -- THE HEADLINE OF THIS ROUND -- OneSplit.packing_part_le (under a packing bound r a non-bipartite
  part of a 1-cut with s non-bipartite parts has packing number at most r + 1 - s, so for s = 2 the
  packing number STRICTLY DECREASES: packing_part_le_lt), OneSplit.packing_part_no_decrease_of_oneSide
  (at a one-sided 1-cut, s = 1, the bound is inherited unchanged -- the descent stalls, the
  machine-checked form of round 48's negative result), and closeToBipartite_of_1split_of_decreasing,
  erdos73On_of_1split_of_decreasing, closeToBipartite_of_1split_of_decreasing_pack -- A NEW INSTANCE
  OF THE HEADLINE THEOREM along the 1-cut axis whose hypothesis on the parts is needed only at the
  DECREASED bound r + 1 - s (constant 1 + s*m, independent of the number of parts, no bound on the
  odd girth, packing weight or branch vertices).  Part 3 proves THE BLOCK-CUT BOUND for the hard
  chains: HardCert G d (d successive 1-cuts each separating two non-bipartite sides),
  exists_packing_of_hardCert (such a chain of length d+1 gives d+1 pairwise disjoint odd cycles) and
  hardCert_isBipartite_of_packing_le (a packing bound r forbids a hard chain of r+1 cuts) -- round
  48's named missing lemma oneDepth_le_of_packing IN THE FORM IN WHICH IT IS TRUE.  A
  MACHINE-CHECKED NEGATIVE RESULT was found on the way:
  JSP90.locIndep_param_cannot_be_lowered shows LocIndep 1 (K_3) while ~LocIndep 0 (K_3), i.e. the
  classical descent cannot be stated in Erdos's own parameter (LocIndep is monotone INCREASING in
  k); every statement of the file is therefore in the packing language.  NOT proved:
  jsp_000090_main; the blocker JSP90.OddCycleErdosPosa r is unchanged, and the remaining obstruction
  is located exactly: the ONE-SIDED chains (a single non-bipartite side at a cut vertex), which
  cannot be bounded by the packing number (triangle with a pendant path: packing number 1, arbitrary
  chain length) and need the block-cut tree and the short-C-path lemma.


