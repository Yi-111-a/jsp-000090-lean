last_round_summary: |
  Round 122 -- THE HUB COVER IS NEVER CHEAPER THAN THE TRUTH, THE RESIDUAL HubByPacking FORCES
  l + q >= 3r - 1, IT IS FALSE AT r = 0, AND THE REDUCTION IS REPAIRED (attack family 59).  NEW
  lean/JSPProblem/HubSharp.lean: 21 declarations, 0 sorry/admit, lake build OK with 1272 jobs, imported
  from the root module -- which also gained the MISSING `import JSPProblem.Hub` (round 121's Hub.lean
  was dead code, never compiled).  NOTE: round 121's lean/JSPProblem/Wheel.lean DOES NOT COMPILE and was
  never in the build, so round 121's negative result JSP90.no_petalSet_bound_of_maxDef is NOT proved;
  its four errors are recorded in ACCEPTANCE.md and in discovery/JSP-000090/policy.json.  TARGET: the
  round-121 residual JSP90.HubByPacking r l q (a SHORT odd cycle meeting every odd cycle, plus a hub
  set meeting every petal; cost l + (q - 1)).  RESULTS: (1) JSP90.hubCost (def) + JSP90.hubCost_ge_
  completeGraph -- the certificate (C.erase c) u Z is a transversal of K_n and no transversal of K_n
  is smaller than n - 2, so EVERY hub cover of K_n costs at least n - 2 and the round-121 instance can
  never beat the truth (with JSP90.card_compl_le_two_completeGraph: a set meeting every odd cycle of K_n
  leaves at most two vertices out).  (2) JSP90.hubByPacking_cost_ge -- HubByPacking r l q with r >= 1
  forces 3r - 2 <= l + (q - 1), i.e. l + q >= 3r - 1 (witness K_{3r}), so the constants of the residual
  must grow at least linearly with slope 3; plus JSP90.hubByPacking_q_ge_three.  (3)
  JSP90.not_hubByPacking_zero -- HubByPacking 0 l q is FALSE for all l, q, so round 121's
  erdos73_of_hubByPacking_of_forall (which assumes all r) demands an impossible hypothesis, and
  JSP90.erdos73_of_hubByPacking_of_succ is the REPAIRED reduction: (all r >= 1, HubByPacking r l q) ->
  all k, Erdos73 k, constant l + (q - 1) independent of k.  (4) THE REPAIRED NUMERICAL ROUTE:
  JSP90.card_petalSet_le_of_hubCover_trianglePetals -- at a SHORTEST odd cycle of length >= 5, if every
  petal is a triangle then |PetalSet G C| <= |Z n C| + 2|Z \ C| for every hub cover Z (a triangle petal's
  hub vertex is ADJACENT to its attachment point), with the contrapositive
  JSP90.card_petalSet_gt_of_hubCover_of_longPetal (a cheap hub set forces a petal of at least five
  vertices) and JSP90.card_petalSet_inter_attachSet_le_two (a hub is adjacent to at most two attachment
  points).  Helpers: card_mod_two_of_isOddCycle, adj_of_oddCycle_card_three, card_biUnion_le_sum_gen,
  card_inter_compl_add, card_univ_sub_add, mem_triple_iff, isOddCycle_triple_completeGraph.
  NOT proved: HubByPacking for ANY r >= 1 (the first non-vacuous case r = 1 is open), the exact minimum
  of hubCost over the hub covers of K_n (only the lower bound), and JSP90.OddCycleErdosPosa r;
  jsp_000090_main is still NOT declared.
