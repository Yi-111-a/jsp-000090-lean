last_round_summary: |
  Round 123 -- THE CONSTANT 2 AT k = 1 (attack family 60).  NEW lean/JSPProblem/Two.lean: 19 declarations,
  0 sorry/admit, lake build OK with 1273 jobs, imported from the root module JSPProblem.lean.  MOTIVATION:
  round 96 measured f(1) = 2 exhaustively for n <= 7 (g6 is LocIndep 1, CloseToBipartite 2, not
  CloseToBipartite 1) and NO proved instance of the headline theorem with Erdős's own hypothesis reached
  that constant; this round re-ran the exhaustive search to n = 8 (all 268435456 graphs, 55179262 with
  MaxDef <= 1, max transversal number 2) and attacked the constant structurally.  RESULTS:
  (1) JSP90.hitsOddCycles_of_isOddCycle_of_locIndep_one -- under LocIndep 1 EVERY odd cycle of G is an odd
  cycle transversal (previously only on the Helly class of round 83 and the disjoint-odd-cycle class of
  round 98), and JSP90.exists_commonVertex_of_oneAttach_pair_of_locIndep_one -- the petals of a cycle
  pairwise meet at k = 1.  (2) JSP90.hitsOddCycles_erase_of_triangle_petalSet_le_two +
  JSP90.closeToBipartite_two_of_triangle_petalSet_le_two + JSP90.erdos73On_of_triangle_petalSet_le_two --
  THE FIRST INSTANCE OF THE HEADLINE THEOREM WITH THE CONSTANT 2 AND ERDOS'S OWN HYPOTHESIS: if a triangle C
  meets every odd cycle and at most two of its vertices are attachment points, then C.erase c (for c in C
  outside the attachment set) meets every odd cycle.  (3) JSP90.closeToBipartite_two_of_triangle_attachCover
  -- the most general form at a triangle: ANY two-element subset T of C meeting every odd cycle that meets C
  in one point meets every odd cycle (the second range |D n C| >= 2 is forced because C \ T has one element),
  with JSP90.attachCover_of_triangle_petalSet_le_two showing (2) is a special case.  (4)
  JSP90.closeToBipartite_two_of_oddCycle_high_intersection + JSP90.erdos73On_of_oddCycle_high_intersection --
  THE CONSTANT 2 FOR A CYCLE OF ARBITRARY LENGTH (every odd cycle uses all but one vertex of C), i.e. the
  part of the constant-2 axis that survives at odd girth >= 5.  (5) JSP90.constant_two_attained_g6 -- the
  constant 2 is attained, so no instance at k = 1 can do better.  (6) JSP90.locIndep_mono (LocIndep k G ->
  LocIndep k' G for k <= k'; the reverse is false, as in k = 2, |S| = 0, |X| = 2).  REFUTED AND RECORDED:
  the draft 'closeToBipartite_two_of_triangle_hub' (a hub z for the petals plus one vertex c of C gives a
  two-element transversal) is FALSE -- an odd cycle meeting C in the other two vertices is missed -- so the
  hub-cover framework of rounds 121-122 was abandoned.  MEASURED (discovery/JSP-000090/r123*.c): MaxDef <= 1
  -> tau_odd <= 2 up to n = 8; f(2) = 3 and f(3) = 4 up to n = 11; and on EVERY LocIndep-1 graph with n <= 7 a
  triangle has at most TWO attachment points (maxima 0,0,1,2,2 for n = 3..7 against maximal transversal number
  1,1,1,2,2).  NOT proved: JSP90.PetalSetLeTwoOfOne (stated as a def, assumed nowhere) and the odd girth >= 5
  case; JSP90.OddCycleErdosPosa r; jsp_000090_main is still NOT declared.  STANDING REGRESSION:
  lean/JSPProblem/Wheel.lean (round 121) still does not compile and is still not imported, so
  JSP90.no_petalSet_bound_of_maxDef is still unproved (rounds 122 and 123 both failed to repair it).
