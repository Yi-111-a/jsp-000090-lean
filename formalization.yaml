last_round_summary: |
  Round 108 -- THE SPLIT-GRAPH WITNESS, AND THE LOWER BOUND f(k) >= k + 1 (attack family 49).  New
  module lean/JSPProblem/SplitSharp.lean (29 declarations, 0 sorry/admit, lake build OK with 1259
  jobs), imported from the root module JSPProblem.lean, plus one line in lean/JSPProblem/Deficiency.lean
  (isIndepSet_of_mem_indepSets) and a correction in place of round 107's Part 4.  Round 107 had named
  the witness on which the constant k+1 of erdos73On_of_splitPartition is attained and left its
  LocIndep proof undone; that witness was WRONG (K_{k+2,k+2} minus a perfect matching is bipartite, so
  its "clique side" carries no edge and it is not a split graph at all, and the independent set it
  proposed is not independent).  The correct witness is JSP90.splitWitness n on Fin n x Bool, with
  Adj p q <-> p.1 != q.1 and not (p.2 = false and q.2 = false): A = {(i,false)} independent, B =
  {(i,true)} a clique, cross edge a_i ~ b_j iff i != j.  Proved: splitWitness_splitPartition,
  not_isolatedPair_splitWitness, locIndep_splitWitness (LocIndep k (splitWitness (k+2))), indepCard_two
  and maxDef_splitWitness (MaxDef (splitWitness (k+2)) = k, the exact value of the hypothesis),
  closeToBipartite_splitWitness, not_closeToBipartite_splitWitness, closeToBipartite_iff_splitWitness
  (CloseToBipartite m (splitWitness (k+2)) <-> k+1 <= m) and -- THE HEADLINE OF THIS ROUND --
  not_erdos73On_splitWitness (~Erdos73On k k for every k >= 1, i.e. the constant f(k) of Erdos #73
  satisfies f(k) >= k+1), the first machine-checked lower bound on that constant strictly larger than
  the f(k) >= k of rounds 39/104 and the first statement about the answer itself rather than about a
  class; erdos73On_of_splitPartition_optimal closes the axis.  NOT proved: jsp_000090_main; the
  blocker JSP90.OddCycleErdosPosa r (Reed-Robertson-Seymour-Thomas, 3-connected case) is unchanged,
  and f(k) >= k+1 is a lower bound whereas the theorem needs a finite f(k).

