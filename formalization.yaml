last_round_summary: |
  Round 101 -- THE ODD-GIRTH LADDER axis (attack family 42).  New module lean/JSPProblem/Stair.lean (28 declarations, 456 lines,
  0 sorry/admit, lake build OK with 1251 jobs), imported from the root module JSPProblem.lean whose docstring was extended.  A
  chain of odd cycles C 0..C (n-1) (JSP90.IsOddCycleChain: C j is an odd cycle of the residue after deleting C 0..C j.succ,
  JSP90.residueOf) with (C j).card <= g j and packing number at most n gives
  JSP90.closeToBipartite_of_girthLadder : CloseToBipartite (g 0 + ... + g (n-1)) H -- each level pays its own girth, with no degree
  bound, no packing-weight bound and no uniform bound on odd cycle length.  The only new index lemma is the SHIFT IDENTITY
  JSP90.residueOf_succChain (inside H - C 0 the tail C 1.. walks exactly the tail of the original chain); the base case is
  JSP90.isBipartite_of_oddCyclePackingLe_zero (packing number 0 => bipartite).  New instance of the headline theorem:
  JSP90.erdos73On_of_girthLadder; and JSP90.erdos73On_of_girthLadder_uniform RE-DERIVES JSPProblem/Transversal.lean's l*k instance
  from the ladder, so the comparison of the two instances is machine-checked (the ladder strictly generalises it because its
  constant sees the sequence of level girths, not only their maximum).  Closed-form staircase instance: for a chain whose levels
  grow like 3, 5, 7, ... , JSP90.erdos73On_of_girthLadder_staircase gives CloseToBipartite (k*k + 2*k) G with the closed form proved
  (JSP90.girthSum_arith, JSP90.staircase_const) and JSP90.staircase_lt_uniform machine-checks k*k + 2*k < (2*k+1)*k for k >= 2.
  jsp_000090_main is still not declared: behind it stands JSP90.OddCycleErdosPosa r, and on this axis the existence of the chain.
  Zero-sorry partial result (build_ok, partial_ok); no prize claim.
