last_round_summary: |
  Round 118 -- THE SPREAD CONSTANT: ROUND 53's CRITICAL-INTERSECTION-GRAPH ROUTE IS CLOSED (attack
  family 56).  New module lean/JSPProblem/CriticalSharp.lean (29 declarations, 0 sorry/admit, lake
  build OK with 1267 jobs), imported from the root module JSPProblem.lean.  Round 53 reduced all of
  Erdos #73 to JSP90.SpreadMinimalTransversal r c (every graph of odd cycle packing number <= r admits
  a minimal transversal whose critical intersection graph is c-colourable) and claimed that c = 2 is
  the classical shape of Reed-Robertson-Seymour-Thomas.  This round COMPUTES that colour count on
  complete graphs and settles both points.  Proved: card_criticalTransversal_completeGraph -- a set of
  K_n carrying critical data has EXACTLY n-2 vertices (a critical cycle of x in X has three vertices
  inside {x} u (V \ X), which has three of them); criticalCycle_eq_completeGraph and
  adj_IntGraph_completeGraph -- every critical cycle is exactly the triangle {x} u (V \ X), so THE
  CRITICAL INTERSECTION GRAPH OF K_n IS THE COMPLETE GRAPH ON ITS TRANSVERSAL;
  spreadTransversal_completeGraph_iff -- THE SPREAD CONSTANT OF A COMPLETE GRAPH, EXACTLY,
  SpreadTransversal c (completeGraph (Fin n)) <-> (n - 2 <= c /\ 0 < c), whence K_4 needs exactly two
  colours and K_5 exactly three (spreadTransversal_completeGraph_four/five) and
  not_spread_transversal_two_completeGraph_five refutes round 53's c = 2 claim; the packing bound of a
  complete graph (sum_card_le_of_disjointFamily, mul_three_le_of_packing_completeGraph,
  packing_card_le_completeGraph: a packing of odd cycles of K_n has at most n/3 members).
  HEADLINE NEGATIVE RESULT: spreadMinimalTransversal_c_ge, not_spreadMinimalTransversal_of_packing and
  no_fixed_spreadConstant -- NO FIXED COLOUR COUNT WORKS: SpreadMinimalTransversal r c forces
  3r - 2 <= c (witness K_{3r}), so the class-level hypothesis of
  JSP90.erdos73_of_spreadMinimalTransversal is FALSE and that route is closed.  AND THE ROUTE IS
  QUADRATIC ANYWAY: exact_spread_constant_locIndep -- K_{k+2} satisfies LocIndep k and has spread
  constant exactly k, while round 53's card_X_le_of_colouring gives |X| <= c*k, so every instance of
  that shape carries a constant >= k*(k+2) against the O(k log k) of Erdos-Posa for odd cycles.  NOT
  proved: jsp_000090_main (still not declared) and JSP90.OddCycleErdosPosa r, which is unchanged;
  round 118 removes one ROUTE, not the theorem.
