last_round_summary: |
  Round 106 -- THE COMPLETE MULTIPARTITE axis (attack family 47).  New module lean/JSPProblem/Multi.lean
  (30 declarations, 0 sorry/admit, lake build OK with 1257 jobs), imported from the root module JSPProblem.lean.
  Round 105 proved that both sides of Erdos #73 are exactly additive over an ANTICOMPLETE cover and recorded its
  own limit: such a cover with two nonempty pieces IS a disconnection, so the additive axis only pays for
  disconnected graphs.  This round attacks the connected complement of that family, the complete multipartite
  graph multi t n = K_{n,...,n} on Fin t x Fin n, and settles it exactly: JSP90.maxDef_multi
  (MaxDef (multi t n) = (t-2)*n, the maximum deficiency of a complete multipartite graph is the number of
  vertices in excess of two per part), JSP90.locIndep_multi_iff, the characterisation
  JSP90.isBipartite_deleteFinset_multi_iff (G - X is bipartite iff its surviving vertices lie in at most two
  parts, via JSP90.liveParts, JSP90.liveParts_le_two_of_isBipartite, JSP90.deadParts,
  JSP90.card_deadParts_add_liveParts and JSP90.isBipartite_multi_of_cover), and hence
  JSP90.closeToBipartite_iff_multi (CloseToBipartite m (multi t n) <-> (t-2)*n <= m): on this class the hypothesis
  and the conclusion of Erdos #73 COINCIDE.  NEW INSTANCE OF THE HEADLINE THEOREM: JSP90.erdos73On_of_multi /
  _univ -- LocIndep k (multi t n) -> CloseToBipartite k (multi t n), the OPTIMAL constant f(k) = k, on a class
  which is connected for t >= 2 (so none of the anticomplete-decomposition instances applies) and is not a
  cluster graph for n >= 2; JSP90.erdos73On_of_multi_optimal and JSP90.not_closeToBipartite_multi
  machine-check the optimality.  NOT proved: jsp_000090_main; the blocker JSP90.OddCycleErdosPosa r
  (Reed-Robertson-Seymour-Thomas, 3-connected case) is unchanged.
